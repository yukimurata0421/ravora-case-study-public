<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAY · 配信スタジオ</title><link rel="stylesheet" href="/overlay.css"></head>
<body class="studio"><main>
<header class="studio-head"><h1>RAY <span>配信スタジオ</span></h1>
<a href="/overlay" target="_blank" rel="noopener">配信画面を開く ↗</a></header>
<section class="screen" aria-label="配信プレビュー">
<canvas id="screen" width="1920" height="1080" role="img" aria-label="Rayの配信画面、コメントと発話字幕"></canvas>
<p id="screen-status" role="status">配信画面を接続中…</p></section>
<section class="controls" aria-label="ホストの音声操作">
<div id="language-tabs" role="tablist" aria-label="会話言語" hidden>
<button id="tab-ja" role="tab" aria-selected="false" aria-controls="conversation" tabindex="-1" data-language="ja">日本語</button>
<button id="tab-en" role="tab" aria-selected="false" aria-controls="conversation" tabindex="-1" data-language="en" lang="en">English</button>
</div>
<span id="language-error" role="status"></span>
<div id="conversation"><div class="actions">
<label for="talk-mode">会話モード</label><select id="talk-mode"><option value="auto">ハンズフリー</option><option value="manual">押して話す</option></select>
<button id="mic" type="button" aria-pressed="false" disabled>マイクをオン</button>
<button id="record" type="button" aria-pressed="false" disabled>Rayに話しかける</button>
<button id="monitor" type="button" aria-pressed="false" disabled>返答モニターを有効化</button></div>
<p id="reply-mode"></p>
<p id="notice" role="status">マイクはミュートです。</p></div></section>
<p id="caption" class="sr-only" aria-live="polite"></p>
</main><script src="/overlay.js" type="module"></script><script src="/host.js" type="module"></script>
</body></html>
