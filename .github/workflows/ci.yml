name: case-study
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[console]'
      - name: Run synthetic replay
        run: ravora-case-study replay
      - name: Check provisional reactions without cloud calls
        run: ravora-case-study early-reaction
      - name: Reproduce contact state without cloud calls
        run: ravora-case-study relationships
      - name: Reproduce the sample clock and mouth plan
        run: ravora-case-study media-timing
      - name: Check the browser timing modules
        run: node --test tests/check_media.mjs
      - name: Test the installed package
        run: python -m unittest discover -s tests -v
      - name: Check the publication allowlist
        run: python scripts/validate_public.py
