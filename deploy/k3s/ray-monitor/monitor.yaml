apiVersion: v1
kind: Namespace
metadata:
  name: ray-monitoring
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ray-observations-retain
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: public-observations
  namespace: ray-monitoring
spec:
  storageClassName: ray-observations-retain
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twitch-observer
  namespace: ray-monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ray-twitch-observer
  template:
    metadata:
      labels:
        app: ray-twitch-observer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: observer
          image: docker.io/library/ray-ravora-observer:local-v1
          imagePullPolicy: Never
          env:
            - name: TWITCH_CHANNEL
              value: ray_ravora
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 750m
              memory: 256Mi
          readinessProbe:
            exec:
              command: [python3, /app/observer.py, --healthy]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [python3, /app/observer.py, --healthy]
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 4
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: public-observations
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
